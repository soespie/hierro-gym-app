<script>
  // Genera el icono de la app en el momento (sin archivos externos) y lo
  // registra como apple-touch-icon para "Añadir a pantalla de inicio".
  (function () {
    try {
      var canvas = document.createElement("canvas");
      canvas.width = 180; canvas.height = 180;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#E2592C";
      ctx.fillRect(0, 0, 180, 180);
      ctx.fillStyle = "#171412";
      ctx.font = "bold 108px -apple-system, Helvetica, Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("H", 92, 100);
      var dataUrl = canvas.toDataURL("image/png");
      ["apple-touch-icon", "icon", "shortcut icon"].forEach(function (rel) {
        var link = document.createElement("link");
        link.rel = rel;
        link.href = dataUrl;
        document.head.appendChild(link);
      });
    } catch (e) { /* si falla, la app sigue funcionando igual */ }
  })();
</script>

<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const DIAS = ["L", "M", "X", "J", "V", "S", "D"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const STORAGE_KEYS = { sessions: "hierro_sessions", routines: "hierro_routines", settings: "hierro_settings" };

function pad(n) { return String(n).padStart(2, "0"); }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function shortDate(s) {
  const [y, m, d] = s.split("-");
  return `${d}/${m}`;
}
function fmtNum(n) {
  if (!isFinite(n)) return "0";
  const r = Math.round(n * 10) / 10;
  return Number.isInteger(r) ? String(r) : String(r.toFixed(1));
}
function exMaxWeight(ex) {
  if (!ex.sets.length) return 0;
  return Math.max(...ex.sets.map((s) => Number(s.weight) || 0));
}
function exVolume(ex) {
  return ex.sets.reduce((a, s) => a + (Number(s.weight) || 0) * (Number(s.reps) || 0), 0);
}
function sessionVolume(s) {
  return s.exercises.reduce((a, e) => a + exVolume(e), 0);
}
function loadLS(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveLS(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* almacenamiento no disponible */ }
}

function IconCal() {
  return (
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2">
      <rect x="3" y="5" width="18" height="16" />
      <line x1="3" y1="9" x2="21" y2="9" />
      <line x1="7" y1="3" x2="7" y2="6" />
      <line x1="17" y1="3" x2="17" y2="6" />
      <rect x="9" y="13" width="3" height="3" fill="currentColor" stroke="none" />

}
function IconGear() {
  return (
    <svg viewBox="0 0 24 24" width="22" height="22">
      <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" strokeWidth="2" />
      <circle cx="15" cy="6" r="2.4" fill="currentColor" />
      <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" strokeWidth="2" />
      <circle cx="8" cy="12" r="2.4" fill="currentColor" />
      <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" strokeWidth="2" />
      <circle cx="17" cy="18" r="2.4" fill="currentColor" />
    </svg>
  );
}

// ---- gráfico de línea sin librerías externas ----
function LineChartSVG({ data, valueKey, color, unit }) {
  if (!data.length) return null;
  const W = 320, H = 150, padL = 32, padR = 10, padT = 10, padB = 22;
  const values = data.map((d) => Number(d[valueKey]) || 0);
  let min = Math.min(...values), max = Math.max(...values);
  if (min === max) { const pad2 = min === 0 ? 1 : Math.abs(min) * 0.15; min -= pad2; max += pad2; }
  const xStep = data.length > 1 ? (W - padL - padR) / (data.length - 1) : 0;
  const xAt = (i) => padL + xStep * i;
  const yAt = (v) => padT + (H - padT - padB) * (1 - (v - min) / (max - min));
  const points = data.map((d, i) => `${xAt(i)},${yAt(values[i])}`).join(" ");
  const mid = (min + max) / 2;
  const maxLabels = 5;
  const labelStep = Math.max(1, Math.ceil(data.length / maxLabels));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="gt-chart-svg" preserveAspectRatio="xMidYMid meet">
      {[min, mid, max].map((v, i) => (
        <g key={i}>
          <line x1={padL} x2={W - padR} y1={yAt(v)} y2={yAt(v)} stroke="#2E3532" strokeWidth="1" />
          <text x={padL - 5} y={yAt(v) + 3} textAnchor="end" fontSize="8" fill="#8B948F">{fmtNum(v)}</text>
        </g>
      ))}
      <polyline points={points} fill="none" stroke={color} strokeWidth="2" />
      {data.map((d, i) => (
        <circle key={i} cx={xAt(i)} cy={yAt(values[i])} r="3" fill={color}>
          <title>{`${d.label}: ${fmtNum(values[i])} ${unit}`}</title>
        </circle>
      ))}
      {data.map((d, i) =>
        i % labelStep === 0 || i === data.length - 1 ? (
          <text key={"l" + i} x={xAt(i)} y={H - 4} textAnchor="middle" fontSize="8" fill="#8B948F">{d.label}</text>
        ) : null
      )}
    </svg>
  );
}

function App() {
  const [tab, setTab] = useState("sesion");
  const [sessions, setSessions] = useState(() => loadLS(STORAGE_KEYS.sessions, []));
  const [routines, setRoutines] = useState(() => loadLS(STORAGE_KEYS.routines, []));
  const [settings, setSettings] = useState(() => loadLS(STORAGE_KEYS.settings, { restSeconds: 90 }));

  useEffect(() => { saveLS(STORAGE_KEYS.sessions, sessions); }, [sessions]);
  useEffect(() => { saveLS(STORAGE_KEYS.routines, routines); }, [routines]);
  useEffect(() => { saveLS(STORAGE_KEYS.settings, settings); }, [settings]);

  // ---- borrador de sesión ----
  const [draftDate, setDraftDate] = useState(todayStr());
  const [draftRoutine, setDraftRoutine] = useState("");
  const [draftExercises, setDraftExercises] = useState([]);
  const [draftNote, setDraftNote] = useState("");
  const [newExName, setNewExName] = useState("");
  const [savedFlash, setSavedFlash] = useState(false);

  const idRef = useRef(0);
  function genId() { idRef.current += 1; return `${Date.now()}-${idRef.current}`; }

  function loadDraftForDate(date) {
    const existing = sessions.find((s) => s.date === date);
    if (existing) {
      setDraftRoutine(existing.routineName || "");
      setDraftExercises(existing.exercises.map((e) => ({ name: e.name, sets: e.sets.map((s) => ({ ...s })) })));
      setDraftNote(existing.note || "");
    } else {
      setDraftRoutine("");
      setDraftExercises([]);
      setDraftNote("");
    }
  }

  function handleDateChange(e) {
    const d = e.target.value;
    setDraftDate(d);
    loadDraftForDate(d);
  }

  function getLastSetForExercise(name, excludeDate) {
    const past = sessions
      .filter((s) => s.date !== excludeDate && s.exercises.some((e) => e.name === name && e.sets.length > 0))
      .sort((a, b) => b.date.localeCompare(a.date));
    if (past.length === 0) return null;
    const ex = past[0].exercises.find((e) => e.name === name);
    return ex.sets[ex.sets.length - 1];
  }

  function addExerciseToDraft() {
    const name = newExName.trim();
    if (!name) return;
    setDraftExercises((prev) =>
      prev.some((e) => e.name.toLowerCase() === name.toLowerCase()) ? prev : [...prev, { name, sets: [] }]
    );
    setNewExName("");
  }

  function loadRoutineIntoDraft(name) {
    const r = routines.find((r) => r.name === name);
    if (!r) return;
    setDraftRoutine(name);
    setDraftExercises((prev) => {
      const existingNames = new Set(prev.map((e) => e.name.toLowerCase()));
      const merged = [...prev];
      r.exercises.forEach((n) => { if (!existingNames.has(n.toLowerCase())) merged.push({ name: n, sets: [] }); });
      return merged;
    });
  }

  function removeExercise(exIdx) {
    setDraftExercises((prev) => prev.filter((_, i) => i !== exIdx));
  }

  function addSet(exIdx) {
    setDraftExercises((prev) =>
      prev.map((e, i) => {
        if (i !== exIdx) return e;
        let pw = "", pr = "";
        if (e.sets.length > 0) {
          const last = e.sets[e.sets.length - 1];
          pw = last.weight; pr = last.reps;
        } else {
          const hist = getLastSetForExercise(e.name, draftDate);
          if (hist) { pw = hist.weight; pr = hist.reps; }
        }
        return { ...e, sets: [...e.sets, { weight: pw, reps: pr }] };
      })
    );
    startTimer();
  }

  function updateSet(exIdx, setIdx, field, value) {
    setDraftExercises((prev) =>
      prev.map((e, i) =>
        i !== exIdx ? e : { ...e, sets: e.sets.map((s, j) => (j !== setIdx ? s : { ...s, [field]: value })) }
      )
    );
  }

  function removeSet(exIdx, setIdx) {
    setDraftExercises((prev) => prev.map((e, i) => (i !== exIdx ? e : { ...e, sets: e.sets.filter((_, j) => j !== setIdx) })));
  }

  function saveSession() {
    const clean = draftExercises
      .filter((e) => e.sets.length > 0)
      .map((e) => ({ name: e.name, sets: e.sets.map((s) => ({ weight: Number(s.weight) || 0, reps: Number(s.reps) || 0 })) }));
    if (clean.length === 0 && !draftNote.trim()) return;
    setSessions((prev) => {
      const others = prev.filter((s) => s.date !== draftDate);
      return [...others, { date: draftDate, routineName: draftRoutine, exercises: clean, note: draftNote }].sort((a, b) => a.date.localeCompare(b.date));
    });
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 1400);
  }

  // ---- cronómetro de descanso ----
  const [timerRemaining, setTimerRemaining] = useState(0);
  const [timerRunning, setTimerRunning] = useState(false);
  useEffect(() => {
    if (!timerRunning) return;
    if (timerRemaining <= 0) { setTimerRunning(false); return; }
    const id = setInterval(() => setTimerRemaining((t) => Math.max(0, t - 1)), 1000);
    return () => clearInterval(id);
  }, [timerRunning, timerRemaining]);
  function startTimer() { setTimerRemaining(Number(settings.restSeconds) || 90); setTimerRunning(true); }
  function adjustTimer(d) { setTimerRemaining((t) => Math.max(0, t + d)); }
  function toggleTimer() { setTimerRunning((r) => !r); }
  function skipTimer() { setTimerRemaining(0); setTimerRunning(false); }

  // ---- rutinas ----
  const [routineFormOpen, setRoutineFormOpen] = useState(false);
  const [editingRoutineId, setEditingRoutineId] = useState(null);
  const [routineName, setRoutineName] = useState("");
  const [routineExNames, setRoutineExNames] = useState([""]);

  function openNewRoutine() { setEditingRoutineId(null); setRoutineName(""); setRoutineExNames([""]); setRoutineFormOpen(true); }
  function openEditRoutine(r) {
    setEditingRoutineId(r.id); setRoutineName(r.name);
    setRoutineExNames(r.exercises.length ? [...r.exercises] : [""]);
    setRoutineFormOpen(true);
  }
  function saveRoutine() {
    const names = routineExNames.map((n) => n.trim()).filter(Boolean);
    if (!routineName.trim() || names.length === 0) return;
    if (editingRoutineId) {
      setRoutines((prev) => prev.map((r) => (r.id === editingRoutineId ? { ...r, name: routineName.trim(), exercises: names } : r)));
    } else {
      setRoutines((prev) => [...prev, { id: genId(), name: routineName.trim(), exercises: names }]);
    }
    setRoutineFormOpen(false);
  }
  function deleteRoutine(id) { setRoutines((prev) => prev.filter((r) => r.id !== id)); }

  const allExerciseNames = useMemo(() => {
    const set = new Set();
    sessions.forEach((s) => s.exercises.forEach((e) => set.add(e.name)));
    routines.forEach((r) => r.exercises.forEach((n) => set.add(n)));
    return Array.from(set).sort();
  }, [sessions, routines]);

  // ---- progreso ----
  const exercisesWithData = useMemo(() => {
    const s = new Set();
    sessions.forEach((se) => se.exercises.forEach((e) => { if (e.sets.length > 0) s.add(e.name); }));
    return Array.from(s).sort();
  }, [sessions]);
  const [progExercise, setProgExercise] = useState("");
  useEffect(() => {
    if (!progExercise && exercisesWithData.length > 0) setProgExercise(exercisesWithData[0]);
    if (progExercise && !exercisesWithData.includes(progExercise) && exercisesWithData.length > 0) setProgExercise(exercisesWithData[0]);
  }, [exercisesWithData]); // eslint-disable-line

  const progData = useMemo(() => {
    if (!progExercise) return [];
    return sessions
      .filter((s) => s.exercises.some((e) => e.name === progExercise && e.sets.length > 0))
      .sort((a, b) => a.date.localeCompare(b.date))
      .map((s) => {
        const ex = s.exercises.find((e) => e.name === progExercise);
        return { date: s.date, label: shortDate(s.date), peso: exMaxWeight(ex), volumen: exVolume(ex) };
      });
  }, [sessions, progExercise]);

  // ---- calendario ----
  const [calMonth, setCalMonth] = useState(() => { const d = new Date(); d.setDate(1); return d; });
  const [selectedDay, setSelectedDay] = useState(null);

  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
  const trainedDates = useMemo(() => new Set(sessions.map((s) => s.date)), [sessions]);

  const monthlySummary = useMemo(() => {
    const monthSessions = sessions
      .filter((s) => { const d = new Date(s.date + "T00:00:00"); return d.getFullYear() === year && d.getMonth() === month; })
      .sort((a, b) => a.date.localeCompare(b.date));
    const totalVol = monthSessions.reduce((a, s) => a + sessionVolume(s), 0);
    const exNames = new Set();
    monthSessions.forEach((s) => s.exercises.forEach((e) => { if (e.sets.length) exNames.add(e.name); }));
    const improvements = [];
    exNames.forEach((name) => {
      const occ = monthSessions.filter((s) => s.exercises.some((e) => e.name === name && e.sets.length));
      const maxWFor = (s) => exMaxWeight(s.exercises.find((e) => e.name === name));
      let delta = null;
      if (occ.length >= 2) {
        delta = maxWFor(occ[occ.length - 1]) - maxWFor(occ[0]);
      } else if (occ.length === 1) {
        const prevSessions = sessions
          .filter((s) => s.date < occ[0].date && s.exercises.some((e) => e.name === name && e.sets.length))
          .sort((a, b) => b.date.localeCompare(a.date));
        if (prevSessions.length > 0) delta = maxWFor(occ[0]) - maxWFor(prevSessions[0]);
      }
      if (delta !== null) improvements.push({ name, delta });
    });
    improvements.sort((a, b) => b.delta - a.delta);
    return { count: monthSessions.length, totalVol, top3: improvements.filter((i) => i.delta > 0).slice(0, 3) };
  }, [sessions, year, month]);

  const selectedSession = selectedDay ? sessions.find((s) => s.date === selectedDay) : null;

  // ---- exportar / importar ----
  const [importMsg, setImportMsg] = useState("");
  const isIOS = useMemo(
    () => typeof navigator !== "undefined" && /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream,
    []
  );
  function exportData() {
    const payload = { version: 1, exportedAt: new Date().toISOString(), sessions, routines, settings };
    const json = JSON.stringify(payload, null, 2);
    const filename = `hierro-${todayStr()}.json`;
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    if (isIOS) {
      a.target = "_blank";
      a.rel = "noopener";
    } else {
      a.download = filename;
    }
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (Array.isArray(data.sessions)) setSessions(data.sessions);
        if (Array.isArray(data.routines)) setRoutines(data.routines);
        if (data.settings) setSettings((prev) => ({ ...prev, ...data.settings }));
        setImportMsg("Listo, se han importado los datos.");
      } catch (err) {
        setImportMsg("No se pudo leer el archivo. ¿Seguro de que es el JSON exportado?");
      }
      setTimeout(() => setImportMsg(""), 3500);
    };
    reader.readAsText(file);
  }

  return (
    <div className="gt-app">
      <style>{CSS}</style>

      <header className="gt-header">
        <span className="gt-logo">Hierro</span>
        <span className="gt-header-sub">{TAB_LABEL[tab]}</span>
      </header>

      <main className="gt-content">
        {tab === "sesion" && (
          <section className="gt-section">
            <div className="gt-field-row">
              <label className="gt-label" htmlFor="fecha">Fecha</label>
              <input id="fecha" type="date" className="gt-input gt-input-date" value={draftDate} onChange={handleDateChange} />
            </div>

            {routines.length > 0 && (
              <div className="gt-block">
                <div className="gt-label">Cargar rutina</div>
                <div className="gt-chip-row">
                  {routines.map((r) => (
                    <button key={r.id} className={"gt-chip" + (draftRoutine === r.name ? " gt-chip-active" : "")} onClick={() => loadRoutineIntoDraft(r.name)}>
                      {r.name}
                    </button>
                  ))}
                </div>
              </div>
            )}

            <div className="gt-block">
              <div className="gt-label">Añadir ejercicio</div>
              <div className="gt-add-ex-row">
                <input
                  className="gt-input" list="ex-names" placeholder="Ej: Sentadilla"
                  value={newExName}
                  onChange={(e) => setNewExName(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") addExerciseToDraft(); }}
                />
                <datalist id="ex-names">{allExerciseNames.map((n) => <option key={n} value={n} />)}</datalist>
                <button className="gt-btn gt-btn-square gt-btn-accent gt-btn-plus" onClick={addExerciseToDraft} aria-label="Añadir ejercicio">+</button>
              </div>
            </div>

            {draftExercises.length === 0 && (
              <p className="gt-empty">Todavía no has añadido ejercicios. Elige una rutina o añádelos a mano.</p>
            )}

            {draftExercises.map((ex, exIdx) => (
              <div className="gt-ex-card" key={ex.name + exIdx}>
                <div className="gt-ex-card-head">
                  <span className="gt-ex-name">{ex.name}</span>
                  <button className="gt-icon-btn" onClick={() => removeExercise(exIdx)} aria-label="Quitar ejercicio">×</button>
                </div>

                {ex.sets.map((set, setIdx) => (
                  <div className="gt-set-row" key={setIdx}>
                    <span className="gt-set-num">{setIdx + 1}</span>
                    <input className="gt-input gt-set-input" type="number" inputMode="decimal" step="0.5" min="0" value={set.weight}
                      onChange={(e) => updateSet(exIdx, setIdx, "weight", e.target.value)} placeholder="0" />
                    <span className="gt-set-unit">kg</span>
                    <span className="gt-set-x">×</span>
                    <input className="gt-input gt-set-input" type="number" inputMode="numeric" step="1" min="0" value={set.reps}
                      onChange={(e) => updateSet(exIdx, setIdx, "reps", e.target.value)} placeholder="0" />
                    <span className="gt-set-unit">reps</span>
                    <button className="gt-icon-btn gt-icon-btn-sm" onClick={() => removeSet(exIdx, setIdx)} aria-label="Borrar serie">×</button>
                  </div>
                ))}

                <button className="gt-btn gt-btn-add-set" onClick={() => addSet(exIdx)}>+ Serie</button>
              </div>
            ))}

            <div className="gt-block">
              <label className="gt-label" htmlFor="nota">Cómo te has sentido</label>
              <textarea id="nota" className="gt-textarea" rows={3} placeholder="Notas libres de la sesión..." value={draftNote} onChange={(e) => setDraftNote(e.target.value)} />
            </div>

            <button className="gt-btn gt-btn-save" onClick={saveSession}>{savedFlash ? "Guardado ✓" : "Guardar sesión"}</button>
          </section>
        )}

        {tab === "rutinas" && (
          <section className="gt-section">
            {!routineFormOpen && (
              <>
                <button className="gt-btn gt-btn-accent gt-btn-full" onClick={openNewRoutine}>+ Nueva rutina</button>
                {routines.length === 0 && <p className="gt-empty">Todavía no has creado ninguna rutina.</p>}
                {routines.map((r) => (
                  <div className="gt-routine-card" key={r.id}>
                    <div className="gt-routine-head">
                      <span className="gt-ex-name">{r.name}</span>
                      <div className="gt-routine-actions">
                        <button className="gt-text-btn" onClick={() => openEditRoutine(r)}>Editar</button>
                        <button className="gt-text-btn" onClick={() => deleteRoutine(r.id)}>Borrar</button>
                      </div>
                    </div>
                    <p className="gt-routine-exs">{r.exercises.join(" · ")}</p>
                  </div>
                ))}
              </>
            )}

            {routineFormOpen && (
              <div className="gt-block">
                <label className="gt-label" htmlFor="rname">Nombre de la rutina</label>
                <input id="rname" className="gt-input" placeholder="Ej: Tren inferior" value={routineName} onChange={(e) => setRoutineName(e.target.value)} />

                <div className="gt-label gt-label-mt">Ejercicios</div>
                {routineExNames.map((n, i) => (
                  <div className="gt-routine-ex-row" key={i}>
                    <input className="gt-input" list="ex-names" placeholder={`Ejercicio ${i + 1}`} value={n}
                      onChange={(e) => setRoutineExNames((prev) => prev.map((v, j) => (j === i ? e.target.value : v)))} />
                    <button className="gt-icon-btn" onClick={() => setRoutineExNames((prev) => prev.filter((_, j) => j !== i))} aria-label="Quitar">×</button>
                  </div>
                ))}
                <datalist id="ex-names">{allExerciseNames.map((n) => <option key={n} value={n} />)}</datalist>
                <button className="gt-btn gt-btn-add-set" onClick={() => setRoutineExNames((prev) => [...prev, ""])}>+ Ejercicio</button>

                <div className="gt-form-actions">
                  <button className="gt-btn gt-btn-ghost" onClick={() => setRoutineFormOpen(false)}>Cancelar</button>
                  <button className="gt-btn gt-btn-save" onClick={saveRoutine}>Guardar rutina</button>
                </div>
              </div>
            )}
          </section>
        )}

        {tab === "progreso" && (
          <section className="gt-section">
            {exercisesWithData.length === 0 ? (
              <p className="gt-empty">Cuando registres series verás aquí la progresión de cada ejercicio.</p>
            ) : (
              <>
                <div className="gt-chip-row">
                  {exercisesWithData.map((n) => (
                    <button key={n} className={"gt-chip" + (progExercise === n ? " gt-chip-active" : "")} onClick={() => setProgExercise(n)}>{n}</button>
                  ))}
                </div>

                <div className="gt-chart-card">
                  <div className="gt-chart-title">Peso máximo por sesión</div>
                  <LineChartSVG data={progData} valueKey="peso" color="#E2592C" unit="kg" />
                </div>

                <div className="gt-chart-card">
                  <div className="gt-chart-title">Volumen total por sesión</div>
                  <p className="gt-chart-hint">Peso × reps × series. Sube aunque el peso se mantenga igual.</p>
                  <LineChartSVG data={progData} valueKey="volumen" color="#7FA36B" unit="kg" />
                </div>
              </>
            )}
          </section>
        )}

        {tab === "calendario" && (
          <section className="gt-section">
            <div className="gt-cal-nav">
              <button className="gt-icon-btn" onClick={() => { const d = new Date(calMonth); d.setMonth(d.getMonth() - 1); setCalMonth(d); setSelectedDay(null); }} aria-label="Mes anterior">‹</button>
              <span className="gt-cal-title">{MESES[month]} {year}</span>
              <button className="gt-icon-btn" onClick={() => { const d = new Date(calMonth); d.setMonth(d.getMonth() + 1); setCalMonth(d); setSelectedDay(null); }} aria-label="Mes siguiente">›</button>
            </div>

            <div className="gt-cal-grid gt-cal-headrow">{DIAS.map((d) => <span key={d} className="gt-cal-headcell">{d}</span>)}</div>
            <div className="gt-cal-grid">
              {Array.from({ length: firstWeekday }).map((_, i) => <span key={"b" + i} />)}
              {Array.from({ length: daysInMonth }).map((_, i) => {
                const day = i + 1;
                const dateStr = `${year}-${pad(month + 1)}-${pad(day)}`;
                const trained = trainedDates.has(dateStr);
                const isSel = selectedDay === dateStr;
                return (
                  <button key={dateStr} className={"gt-cal-day" + (trained ? " gt-cal-day-trained" : "") + (isSel ? " gt-cal-day-sel" : "")} onClick={() => setSelectedDay(isSel ? null : dateStr)}>
                    {day}
                  </button>
                );
              })}
            </div>

            {selectedDay && (
              <div className="gt-day-detail">
                <div className="gt-day-detail-head">
                  <span>{shortDate(selectedDay)}</span>
                  {selectedSession && (
                    <button className="gt-text-btn" onClick={() => { setSessions((prev) => prev.filter((s) => s.date !== selectedDay)); setSelectedDay(null); }}>Borrar</button>
                  )}
                </div>
                {selectedSession ? (
                  <>
                    {selectedSession.routineName && <p className="gt-day-routine">{selectedSession.routineName}</p>}
                    {selectedSession.exercises.map((ex) => (
                      <p key={ex.name} className="gt-day-ex">{ex.name}: {ex.sets.length} serie{ex.sets.length !== 1 ? "s" : ""} · máx {fmtNum(exMaxWeight(ex))} kg</p>
                    ))}
                    <p className="gt-day-vol">Volumen total: {fmtNum(sessionVolume(selectedSession))} kg</p>
                    {selectedSession.note && <p className="gt-day-note">"{selectedSession.note}"</p>}
                  </>
                ) : (
                  <p className="gt-empty">Sin entrenamiento ese día.</p>
                )}
              </div>
            )}

            <div className="gt-summary-card">
              <div className="gt-chart-title">Resumen del mes</div>
              <div className="gt-summary-row"><span>Sesiones</span><span>{monthlySummary.count}</span></div>
              <div className="gt-summary-row"><span>Volumen total</span><span>{fmtNum(monthlySummary.totalVol)} kg</span></div>
              {monthlySummary.top3.length > 0 && (
                <>
                  <div className="gt-label gt-label-mt">Donde más has subido</div>
                  {monthlySummary.top3.map((i) => (
                    <div className="gt-summary-row" key={i.name}><span>{i.name}</span><span className="gt-good">+{fmtNum(i.delta)} kg</span></div>
                  ))}
                </>
              )}
            </div>
          </section>
        )}

        {tab === "ajustes" && (
          <section className="gt-section">
            <div className="gt-block">
              <label className="gt-label" htmlFor="rest">Descanso entre series (segundos)</label>
              <input id="rest" type="number" inputMode="numeric" min="0" step="5" className="gt-input" value={settings.restSeconds}
                onChange={(e) => setSettings((prev) => ({ ...prev, restSeconds: e.target.value }))} />
            </div>

            <div className="gt-block">
              <div className="gt-label">Datos</div>
              <button className="gt-btn gt-btn-accent gt-btn-full" onClick={exportData}>Exportar a JSON</button>
              {isIOS && <p className="gt-hint">Se abrirá en una pestaña nueva: toca el icono de compartir y elige «Guardar en Archivos».</p>}
              <label className="gt-btn gt-btn-ghost gt-btn-full gt-file-label">
                Importar JSON
                <input type="file" accept=".json,application/json" style={{ display: "none" }}
                  onChange={(e) => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; }} />
              </label>
              {isIOS && <p className="gt-hint">En iPhone: elige el archivo desde la app Archivos.</p>}
              {importMsg && <p className="gt-import-msg">{importMsg}</p>}
            </div>
          </section>
        )}
      </main>

      {timerRemaining > 0 && (
        <div className="gt-timer-bar">
          <button className="gt-timer-btn" onClick={() => adjustTimer(-15)} aria-label="Restar 15 segundos">−15</button>
          <span className="gt-timer-time">{Math.floor(timerRemaining / 60)}:{pad(timerRemaining % 60)}</span>
          <button className="gt-timer-btn" onClick={() => adjustTimer(15)} aria-label="Sumar 15 segundos">+15</button>
          <button className="gt-text-btn" onClick={toggleTimer}>{timerRunning ? "Pausar" : "Seguir"}</button>
          <button className="gt-text-btn" onClick={skipTimer}>Saltar</button>
        </div>
      )}

      <p className="gt-footnote">Los datos se guardan automáticamente en este dispositivo. Usa «Exportar a JSON» en Ajustes para hacer una copia de seguridad o pasarlos a otro aparato.</p>

      <nav className="gt-nav">
        {NAV.map((n) => (
          <button key={n.key} className={"gt-nav-btn" + (tab === n.key ? " gt-nav-btn-active" : "")} onClick={() => setTab(n.key)}>
            <n.Icon />
            <span>{n.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

const NAV = [
  { key: "sesion", label: "Sesión", Icon: IconBarbell },
  { key: "rutinas", label: "Rutinas", Icon: IconList },
  { key: "progreso", label: "Progreso", Icon: IconTrend },
  { key: "calendario", label: "Calendario", Icon: IconCal },
  { key: "ajustes", label: "Ajustes", Icon: IconGear },
];
const TAB_LABEL = { sesion: "Registrar sesión", rutinas: "Rutinas", progreso: "Progresión", calendario: "Calendario", ajustes: "Ajustes" };

const CSS = `
.gt-app {

}
.gt-input:focus, .gt-textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }

.gt-btn-plus { font-size:26px; font-weight:700; line-height:1; }
.gt-btn-save { width:100%; min-height:58px; background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-size:17px; }
.gt-btn-add-set { width:100%; background:var(--surface); border-style:dashed; color:var(--text-dim); }
.gt-icon-btn {
  display:flex; align-items:center; justify-content:center;
  width:44px; height:44px; background:transparent; border:1px solid var(--border);
  color:var(--text-dim); border-radius:2px; cursor:pointer; flex-shrink:0; font-size:20px; font-weight:700; line-height:1;
}
.gt-icon-btn-sm { width:36px; height:36px; font-size:16px; }
.gt-text-btn { display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:8px 14px; font-size:13px; font-weight:600; border:1px solid var(--border); background:transparent; color:var(--text-dim); border-radius:2px; cursor:pointer; }
.gt-chip-row { display:flex; flex-wrap:wrap; gap:8px; }
.gt-chip { padding:10px 14px; font-size:14px; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:2px; cursor:pointer; }
.gt-chip-active { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700; }
.gt-add-ex-row { display:flex; gap:8px; }
.gt-empty { color:var(--text-dim); font-size:14px; padding:8px 0; }
.gt-ex-card { border:1px solid var(--border); background:var(--surface); padding:14px; border-radius:2px; display:flex; flex-direction:column; gap:10px; }
.gt-ex-card-head { display:flex; justify-content:space-between; align-items:center; }
.gt-ex-name { font-size:17px; font-weight:700; }
.gt-set-row { display:flex; align-items:center; gap:8px; }
.gt-set-num { width:20px; color:var(--text-dim); font-size:13px; text-align:center; flex-shrink:0; }
.gt-set-input { width:64px; text-align:center; padding:12px 6px; flex:0 0 auto; }
.gt-set-unit { color:var(--text-dim); font-size:13px; flex-shrink:0; }
.gt-set-x { color:var(--text-dim); flex-shrink:0; }
.gt-routine-card { border:1px solid var(--border); background:var(--surface); padding:14px; border-radius:2px; display:flex; flex-direction:column; gap:6px; }
.gt-routine-head { display:flex; justify-content:space-between; align-items:center; }
.gt-routine-actions { display:flex; gap:8px; }
.gt-routine-exs { color:var(--text-dim); font-size:14px; margin:0; }
.gt-routine-ex-row { display:flex; gap:8px; align-items:center; }
.gt-form-actions { display:flex; gap:10px; margin-top:8px; }
.gt-form-actions .gt-btn { flex:1; }
.gt-chart-card { border:1px solid var(--border); background:var(--surface); padding:14px 8px 6px; border-radius:2px; }
.gt-chart-title { font-size:15px; font-weight:700; padding:0 8px; }
.gt-chart-hint { font-size:12px; color:var(--text-dim); padding:0 8px; margin:2px 0 4px; }
.gt-chart-svg { width:100%; height:150px; display:block; }
.gt-cal-nav { display:flex; align-items:center; justify-content:space-between; }
.gt-cal-title { font-size:16px; font-weight:700; text-transform:capitalize; }
.gt-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.gt-cal-headrow { margin-bottom:2px; }
.gt-cal-headcell { text-align:center; font-size:12px; color:var(--text-dim); padding:4px 0; }
.gt-cal-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:14px; border-radius:2px; cursor:pointer; position:relative; }
.gt-cal-day-trained { background:var(--surface); border-color:var(--accent); color:var(--accent); font-weight:700; }
.gt-cal-day-trained::after { content:""; position:absolute; bottom:4px; width:5px; height:5px; background:var(--accent); border-radius:50%; }
.gt-cal-day-sel { outline:2px solid var(--accent); outline-offset:-2px; }
.gt-day-detail { border:1px solid var(--border); background:var(--surface); padding:14px; border-radius:2px; }
.gt-day-detail-head { display:flex; justify-content:space-between; align-items:center; font-weight:700; margin-bottom:6px; }
.gt-day-routine { color:var(--accent); font-size:13px; margin:0 0 4px; }
.gt-day-ex { margin:2px 0; font-size:14px; }
.gt-day-vol { margin:8px 0 0; font-weight:700; font-size:14px; }
.gt-day-note { margin:6px 0 0; color:var(--text-dim); font-size:13px; font-style:italic; }
.gt-summary-card { border:1px solid var(--border); background:var(--surface); padding:14px; border-radius:2px; display:flex; flex-direction:column; gap:4px; }
.gt-summary-row { display:flex; justify-content:space-between; font-size:14px; padding:4px 0; }
.gt-good { color:var(--good); font-weight:700; }
.gt-file-label { cursor:pointer; }
.gt-import-msg { font-size:13px; color:var(--good); }
.gt-hint { font-size:12px; color:var(--text-dim); margin:-2px 0 4px; }
.gt-timer-bar {
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(78px + env(safe-area-inset-bottom)); width:100%; max-width:480px;
  background:var(--surface2); border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; gap:10px; padding:8px 12px; box-sizing:border-box; flex-wrap:wrap;
}
.gt-timer-btn { width:auto; min-height:36px; padding:0 10px; font-size:13px; font-weight:700; background:transparent; border:1px solid var(--border); color:var(--text-dim); border-radius:2px; cursor:pointer; }
.gt-timer-time { display:flex; align-items:center; gap:6px; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; min-width:70px; justify-content:center; }
.gt-footnote { text-align:center; font-size:11px; color:var(--text-dim); padding:6px 20px 10px; margin:0; position:fixed; left:50%; transform:translateX(-50%); bottom:calc(56px + env(safe-area-inset-bottom)); width:100%; max-width:480px; box-sizing:border-box; background:var(--bg); }
.gt-nav { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px; display:flex; background:var(--surface); border-top:1px solid var(--border); box-sizing:border-box; padding-bottom: env(safe-area-inset-bottom); }
.gt-nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 4px 8px; background:transparent; border:none; color:var(--text-dim); font-size:11px; cursor:pointer; }
.gt-nav-btn-active { color:var(--accent); }
`;

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
